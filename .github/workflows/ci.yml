name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  ios:
    uses: RISCfuture/XCUITestKit/.github/workflows/ios-ci.yml@main
    with:
      scheme: FART
      unit-test-plan: "Unit Tests"
      ui-test-plan: "UI Tests"
      build-matrix: |
        {
          "include": [
            {
              "ios-label": "latest",
              "runner": "macos-26",
              "device": "iPhone 17 Pro",
              "device-type": "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro",
              "os-version": "",
              "xcode-version": "latest-stable"
            }
          ]
        }
      ui-matrix: |
        {
          "include": [
            {
              "ios-label": "latest",
              "runner": "macos-26",
              "device": "iPhone 17 Pro",
              "device-type": "com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro",
              "os-version": "",
              "xcode-version": "latest-stable"
            },
            {
              "ios-label": "latest",
              "runner": "macos-26",
              "device": "iPad Pro 13-inch (M5)",
              "device-type": "com.apple.CoreSimulator.SimDeviceType.iPad-Pro-13-inch-M5-12GB",
              "os-version": "",
              "xcode-version": "latest-stable"
            }
          ]
        }

  macos:
    name: macOS Build and Test
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # setup-swift xcode-selects /Applications/Xcode_26.5.app, which is
      # required to open project file format 100.
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.3"
      - uses: actions/checkout@v6
      - name: Enable macros
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Record toolchain version
        id: toolchain
        run: echo "xcode=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-
      - name: Cache Xcode build products
        uses: actions/cache@v6
        with:
          path: DerivedData
          key: derived-macos-test-macos-26-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('**/Package.resolved') }}
      - name: Build and test (macOS)
        run: |
          xcodebuild test \
            -project "Flight Assessment of Risk Tool.xcodeproj" \
            -scheme FART \
            -destination "platform=macOS" \
            -testPlan "Unit Tests" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

  visionos:
    name: visionOS Build
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # setup-swift xcode-selects /Applications/Xcode_26.5.app, which is
      # required to open project file format 100.
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.3"
      - uses: actions/checkout@v6
      - name: Enable macros
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Record toolchain version
        id: toolchain
        run: echo "xcode=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-
      - name: Cache Xcode build products
        uses: actions/cache@v6
        with:
          path: DerivedData
          key: derived-visionos-macos-26-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('**/Package.resolved') }}
      # The app target supports visionOS, but nothing ships there and no test
      # plan runs against it, so this compiles the slice rather than testing it.
      # Without this the visionOS build can break while every other job stays
      # green.
      - name: Build (visionOS)
        run: |
          xcodebuild build \
            -project "Flight Assessment of Risk Tool.xcodeproj" \
            -scheme FART \
            -destination "generic/platform=visionOS Simulator" \
            -derivedDataPath DerivedData \
            CODE_SIGNING_ALLOWED=NO

  docs:
    name: Documentation Build
    runs-on: macos-26
    steps:
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      # setup-swift xcode-selects /Applications/Xcode_26.5.app, which is
      # required to open project file format 100.
      - uses: SwiftyLab/setup-swift@latest
        with:
          swift-version: "6.3"
      - uses: actions/checkout@v6
      - name: Enable macros
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Record toolchain version
        id: toolchain
        run: echo "xcode=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-
      - name: Cache Xcode build products
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/docs
          key: derived-docs-macos-26-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('**/Package.resolved') }}
      - name: Build documentation (macOS)
        # docbuild documents the package dependencies too, and their DocC
        # warnings are upstream's to fix, so the strict flag is looked up by
        # target name and only FART has a value to find.
        run: |
          # shellcheck disable=SC2016 # xcodebuild, not the shell, expands these
          xcodebuild docbuild \
            -project "Flight Assessment of Risk Tool.xcodeproj" \
            -scheme FART \
            -destination "platform=macOS" \
            -derivedDataPath "$RUNNER_TEMP/docs" \
            CODE_SIGNING_ALLOWED=NO \
            'OTHER_DOCC_FLAGS=$(DOCC_STRICT_$(TARGET_NAME))' \
            DOCC_STRICT_FART="--warnings-as-errors"
