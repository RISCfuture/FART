name: Promo

# Checks the App Store promo copy and storyboard against Apple's rules and against each other.
on:
  push:
    branches: [main, "release/**"]
    paths: [promo/**]
  pull_request:
    paths: [promo/**]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check promo copy and storyboard
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: promo
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: pnpm/action-setup@v6.1.0
        with:
          package_json_file: promo/package.json
      - uses: actions/setup-node@v7.1.0
        with:
          node-version-file: promo/.nvmrc
          cache: pnpm
          cache-dependency-path: promo/pnpm-lock.yaml
      - name: Install
        run: pnpm install --frozen-lockfile
      - name: Check
        run: pnpm promokit check
