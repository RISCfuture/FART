name: Periphery

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  periphery:
    name: Run Periphery
    runs-on: xcode-27
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      contents: read
    steps:
      - name: Ensure iOS simulator runtime
        run: |
          VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
          if xcrun simctl list runtimes | grep -q "iOS ${VERSION}"; then
            echo "iOS ${VERSION} runtime already installed"
          else
            echo "iOS ${VERSION} runtime not found, downloading..."
            xcodebuild -downloadPlatform iOS
          fi
      - name: Create simulator
        id: sim
        run: |
          while xcrun simctl delete "periphery-sim" 2>/dev/null; do :; done
          UDID=$(xcrun simctl create "periphery-sim" com.apple.CoreSimulator.SimDeviceType.iPhone-17-Pro)
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@v6
      - name: Enable macros
        run: defaults write com.apple.dt.Xcode IDESkipMacroFingerprintValidation -bool YES
      - name: Record toolchain version
        id: toolchain
        run: echo "xcode=$(xcodebuild -version | tr '\n' '-')" >> "$GITHUB_OUTPUT"
      - name: Cache SwiftPM dependencies
        uses: actions/cache@v6
        with:
          path: ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ runner.os }}-${{ hashFiles('**/Package.resolved') }}
          restore-keys: |
            spm-${{ runner.os }}-
      - name: Cache Xcode build products
        uses: actions/cache@v6
        with:
          path: ~/Library/Developer/Xcode/DerivedData
          key: derived-periphery-xcode-27-${{ steps.toolchain.outputs.xcode }}-${{ hashFiles('**/Package.resolved') }}
      - name: Install Periphery
        run: |
          brew update
          brew install periphery-pro/tap/periphery-cli
      - name: Run Periphery
        env:
          PERIPHERY_TOKEN: ${{ secrets.PERIPHERY_TOKEN }}
          SIM_UDID: ${{ steps.sim.outputs.udid }}
        run: |
          periphery scan \
            --strict \
            --project "Flight Assessment of Risk Tool.xcodeproj" \
            --schemes FART \
            --exclude-targets "FARTUnitTests,FARTUITests" \
            --exclude-tests \
            --disable-update-check \
            -- \
            -destination "platform=iOS Simulator,id=${SIM_UDID}" \
            -destination-timeout 300
