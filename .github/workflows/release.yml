name: Release

# Pushing a version tag builds the release and finishes it: the app is archived for every platform
# and uploaded to App Store Connect, the version's release notes are written from CHANGELOG.md, and
# the build is attached to the version once Apple has processed it. Submitting for review is the
# only step left by hand.
#
# Re-tagging a version is how its build is replaced. The tag push runs all of this again and the
# version ends up pointing at the newer build; the older one stays on App Store Connect, since a
# build can be expired but never deleted. A tag push is a deploy, not bookkeeping.
#
# Nothing here re-runs the tests: tag a commit CI has already passed.
on:
  push:
    tags: ["[0-9]+.[0-9]+*"]
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version to build and upload.
        required: true
        type: string

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  release:
    uses: RISCfuture/XCUITestKit/.github/workflows/ios-release.yml@main
    with:
      # The app target also builds for visionOS, but there is no visionOS App Store listing.
      platforms: '["iOS","macOS"]'
      version: ${{ inputs.version || github.ref_name }}
      certificates-repo: RISCfuture/certificates
      verify-lane: ci_verify_release_notes
      finish-lane: ci_finish_release
    secrets:
      certificates-token: ${{ secrets.CERTIFICATES_TOKEN }}
      match-password: ${{ secrets.MATCH_PASSWORD }}
      sentry-auth-token: ${{ secrets.SENTRY_AUTH_TOKEN }}
