<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Preview caption</title>

    <!--
      Renders one frame of a caption flying into the App Store preview, on a transparent
      background. Scripts/edit-preview.sh loads this page once per frame of the entrance, at the
      preview's width and a device pixel ratio of 1, passing:

        caption  the line to set
        t        seconds since the caption began its entrance

      Each word slides in slanted, overshoots, and settles upright, a beat after the word before it.
      The animations are paused and offset by t, so every load renders one exact moment.
    -->

    <style>
      @font-face {
        font-family: "Archivo Expanded";
        src: url("../../docs/fonts/archivo-expanded.woff2") format("woff2-variations");
        font-weight: 100 900;
      }

      :root {
        --ink: #1a1712;
        --paper: #fcfbf8;
        --entrance: 0.34s;
        --stagger: 0.055s;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
        background: transparent;
      }

      body {
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 0 6vw;
      }

      h1 {
        font-family: "Archivo Expanded", sans-serif;
        font-size: 9.4vw;
        font-weight: 800;
        letter-spacing: -0.025em;
        line-height: 1.02;
        text-align: center;
        text-wrap: balance;
        color: var(--ink);
        -webkit-text-stroke: 0.3em var(--paper);
        paint-order: stroke fill;
      }

      span {
        display: inline-block;
        animation: fly-in var(--entrance) cubic-bezier(0.2, 0.8, 0.25, 1) both paused;
        animation-delay: calc(var(--index) * var(--stagger) - var(--t) * 1s);
      }

      @keyframes fly-in {
        0% {
          opacity: 0;
          transform: translateX(-1.4em) skewX(-28deg);
          filter: blur(0.08em);
        }

        30% {
          opacity: 1;
        }

        70% {
          transform: translateX(0.06em) skewX(7deg);
          filter: blur(0);
        }

        100% {
          transform: none;
        }
      }
    </style>
  </head>

  <body>
    <h1 data-caption></h1>

    <script>
      const params = new URLSearchParams(location.search);
      const heading = document.querySelector("[data-caption]");
      document.documentElement.style.setProperty("--t", params.get("t") ?? "1");
      params
        .get("caption")
        .split(" ")
        .forEach((word, index) => {
          const span = document.createElement("span");
          span.textContent = word;
          span.style.setProperty("--index", index);
          heading.append(span, " ");
        });
    </script>
  </body>
</html>
