<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Screenshot caption frame</title>

    <!--
      Renders one captioned App Store screenshot. Scripts/caption-screenshots.sh loads this page at
      the screenshot's exact size, with a device pixel ratio of 1, passing:

        image    file URL of the capture
        caption  the line to set above it
        band     low, moderate or high: the tint of the background
        layout   phone, tablet or mac
    -->

    <style>
      @font-face {
        font-family: "Archivo Expanded";
        src: url("../../docs/fonts/archivo-expanded.woff2") format("woff2-variations");
        font-weight: 100 900;
      }

      :root {
        --low: #369d1e;
        --moderate: #daba2c;
        --high: #b41834;
        --ink: #1a1712;
        --paper: #fcfbf8;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }

      body {
        display: flex;
        flex-direction: column;
        align-items: center;
        background: color-mix(in oklab, var(--band) var(--wash, 9%), var(--paper));
      }

      [data-band="low"] { --band: var(--low); }
      [data-band="moderate"] { --band: var(--moderate); --wash: 12%; }
      [data-band="high"] { --band: var(--high); --wash: 7%; }

      h1 {
        font-family: "Archivo Expanded", sans-serif;
        font-weight: 700;
        letter-spacing: -0.02em;
        line-height: 1.02;
        text-align: center;
        text-wrap: balance;
        color: var(--ink);
      }

      img {
        display: block;
      }

      /* A phone or tablet capture is the whole screen: show it as one, running off the bottom edge. */
      [data-layout="phone"] h1,
      [data-layout="tablet"] h1 {
        margin: 11vh 7vw 0;
        font-size: 7.6vw;
      }

      [data-layout="tablet"] h1 {
        margin-top: 7vh;
        font-size: 5.4vw;
      }

      [data-layout="phone"] img,
      [data-layout="tablet"] img {
        width: 84vw;
        margin-top: 5vh;
        border-radius: var(--screen-radius);
        box-shadow:
          0 0 0 1px hsl(30deg 8% 20% / 0.08),
          0 3vw 8vw -2vw hsl(30deg 8% 20% / 0.3);
      }

      [data-layout="phone"] { --screen-radius: 11vw; }
      [data-layout="tablet"] { --screen-radius: 3.6vw; }

      /* A Mac capture is already the window on a tinted canvas, set low to leave room at the top:
         use it whole, with the caption over that room. */
      [data-layout="mac"] img {
        position: absolute;
        inset: 0;
        width: 100vw;
        height: 100vh;
      }

      [data-layout="mac"] h1 {
        position: relative;
        z-index: 1;
        margin-top: 6.5vh;
        font-size: 3.6vw;
      }
    </style>
  </head>

  <body>
    <h1 data-caption></h1>
    <img data-image alt="" />

    <script>
      const params = new URLSearchParams(location.search);
      document.body.dataset.band = params.get("band");
      document.body.dataset.layout = params.get("layout");
      document.querySelector("[data-caption]").textContent = params.get("caption");
      document.querySelector("[data-image]").src = params.get("image");
    </script>
  </body>
</html>
